behaviors:
  MoveToGoalSAC:
    trainer_type: sac
    hyperparameters:
      batch_size: 256
      buffer_size: 1000000
      learning_rate: 0.0003
      learning_rate_schedule: linear
      
      buffer_init_steps: 0
      tau: 0.005
      steps_per_update: 20.0
      save_replay_buffer: false
      init_entcoef: 0.5
      reward_signal_steps_per_update: 10.0
    network_settings:
      # use_recurrent: true
      # sequence_length: 64
      # memory_size: 256
      normalize: true
      hidden_units: 512
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 0.9
      curiosity:
        gamma: 0.99
        strength: 0.001
        encoding_size: 128
    #   gail:
    #     strength: 0.4
    #     demo_path: "C:\\Users\\Adrian\\Desktop\\RL\\Assets\\Demonstrations\\SmallDungeon.demo"
    # behavioral_cloning:
    #   strength: 0.4
    #   demo_path: "C:\\Users\\Adrian\\Desktop\\RL\\Assets\\Demonstrations\\SmallDungeon.demo"
    max_steps: 10000000000000000000000000000000
    time_horizon: 64
    summary_freq: 10000
    keep_checkpoints: 100000000000